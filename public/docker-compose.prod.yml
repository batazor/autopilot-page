# External-user setup — pulls pre-built images from GitHub Container Registry
# (published by ``.github/workflows/docker.yml`` when a GitHub Release is
# published). No local toolchain required.
#
# Usage (from any folder):
#     curl -fsSL https://batazor.github.io/autopilot-page/docker-compose.prod.yml -o docker-compose.prod.yml
#     docker compose -f docker-compose.prod.yml up -d
#     open http://127.0.0.1:3000/overview
#
# First start:
#   * area.json, references/, db/buildings, db/gear, db/items, db/assets are
#     baked into the image — nothing to mount, nothing to seed.
#   * The dashboard prompts for a license file on first load. Grab the current
#     ``licence.jwt`` from the ``#install`` channel on Discord, upload it
#     in the UI, and the bot service continues automatically.
#
# Images are currently published as ``:latest`` only. ``WOS_IMAGE_TAG`` remains
# configurable for private forks that publish their own tags.
#
# Using a fork's images:
#     WOS_REGISTRY=ghcr.io/your-fork docker compose -f docker-compose.prod.yml up -d
#
# === ADB / network model ===
# ``bot``, ``api``, and ``web`` run in ``network_mode: host`` so app containers
# share the host's loopback. That way the host's ``adb start-server`` (bound to
# 127.0.0.1:5037 by default — safe) is reachable as ``127.0.0.1:5037`` from
# inside the containers, **without** exposing ADB on the host's external
# interfaces via ``adb -a``.
#
# Side effects of host-mode that this file already accounts for:
#   * app containers cannot use Compose-internal DNS names for services that
#     share host-mode networking. ``bot`` and ``api`` talk to Redis over the
#     shared ``redis_socket`` named volume.
#   * ``bot``, ``api``, and ``web`` have no ``ports:`` blocks — they bind
#     directly on host loopback according to their own service settings.
#   * ``api`` and ``web`` also use host-mode so the dashboard's ADB scan and
#     the bot workers see the same host loopback. All app services talk to Redis
#     over the shared ``redis_socket`` named volume, not over TCP.
#
# Platform support:
#   * **Linux** — ``network_mode: host`` is fully supported out of the box.
#   * **Docker Desktop (macOS/Windows)** — works only with the **Host
#     networking** beta enabled: Settings → Resources → Network → "Enable
#     host networking". Without it, app containers can mount the Redis socket
#     but **not** reliably reach the host's adb server.
#
# === Persistent state ===
# Only the mutable runtime bits live in named volumes (shared between bot and api):
#   * ``wos_state``   → /app/db/state    (SQLite: devices, accounts, runtime)
#   * ``wos_license`` → /app/license-data (license file uploaded via the UI)
#   * ``wos_temporal``→ /app/temporal    (rolling screenshots for dashboard preview)
# Both survive ``docker compose down``; wiped only by ``docker compose down -v``.

services:
  redis:
    image: redis:alpine
    container_name: autopilot-redis
    # ``redis:alpine`` runs as the ``redis`` user, but a fresh named volume
    # is mounted root-owned — so bind() on the socket fails with EACCES on
    # first boot. ``chown`` the socket dir in a thin entrypoint wrapper,
    # then ``exec docker-entrypoint.sh`` keeps the upstream UID drop. The
    # ``--unixsocketperm 777`` line lets bot/api containers (different UIDs
    # from ``redis``) connect without us aligning UIDs across images.
    entrypoint:
      - sh
      - -c
      - >
        chown redis:redis /var/run/redis &&
        exec docker-entrypoint.sh
        redis-server
        --appendonly yes
        --unixsocket /var/run/redis/redis.sock
        --unixsocketperm 777
    # No ``ports:`` — every service talks to Redis over the ``redis_socket``
    # unix socket, so there is nothing to publish. Exposing 6379 (even on
    # loopback) would needlessly hand any local process anonymous read/write
    # to the queue and state.
    volumes:
      - redis_data:/data
      - redis_socket:/var/run/redis
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "-s", "/var/run/redis/redis.sock", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  bot:
    image: ${WOS_REGISTRY:-ghcr.io/batazor/autopilot}/bot:${WOS_IMAGE_TAG:-latest}
    # Stable name so you can shell in directly, e.g.
    #     docker exec autopilot-bot adb devices
    container_name: autopilot-bot
    # host-mode: shared loopback with the host so ``adb`` and the
    # ``127.0.0.1:5037`` server are reachable without ``adb -a`` (which would
    # expose ADB on every interface, including LAN).
    network_mode: host
    depends_on:
      redis:
        condition: service_healthy
    environment:
      # ``redis-py`` accepts ``unix:///path?db=N`` directly. Volume-mounted
      # at the same path in this container; host-mode networking doesn't
      # affect bind mounts.
      WOS_REDIS_URL: unix:///var/run/redis/redis.sock?db=0
      # Host's adb server, untouched (default loopback bind is fine because
      # the container shares the host's lo).
      ADB_SERVER_SOCKET: tcp:127.0.0.1:5037
      # ``WOS_LICENSE`` env override; the primary path is the license file
      # uploaded through the dashboard (lands in the ``wos_license`` volume).
      WOS_LICENSE: ${WOS_LICENSE:-}
    volumes:
      - wos_state:/app/db/state
      - wos_license:/app/license-data
      - wos_temporal:/app/temporal
      - redis_socket:/var/run/redis
    restart: unless-stopped
    healthcheck:
      # The supervisor serves a loopback /health endpoint (worker.health_server)
      # reporting reconcile-loop liveness — catches a hung-but-alive supervisor,
      # not just process existence. Port via WOS_BOT_HEALTH_PORT (default 8770);
      # keep this curl in sync. ``bot`` uses host networking, so 127.0.0.1 hits it.
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8770/health"]
      interval: 30s
      timeout: 5s
      start_period: 45s
      retries: 3

  # Roboflow object-detection inference server (Fishing Tournament fish
  # detector → model find-fish-ssnpa/6). It publishes only host loopback, and
  # host-networked ``api`` reaches it on ``127.0.0.1:9001``. Set ROBOFLOW_API_KEY
  # in the environment so the server can pull weights on first request (cached
  # in ``inference_cache``).
  #
  # OPTIONAL — gated behind the ``full`` / ``inference`` profile so the default
  # stack does not pull this image. Enable it with:
  #     ROBOFLOW_API_KEY=rf_... docker compose -f docker-compose.prod.yml --profile full up -d
  inference:
    image: roboflow/roboflow-inference-server-cpu:latest
    container_name: autopilot-inference
    profiles: ["full", "inference"]
    environment:
      ROBOFLOW_API_KEY: ${ROBOFLOW_API_KEY:-}
    volumes:
      - inference_cache:/tmp/cache
    ports:
      - "127.0.0.1:9001:9001"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9001/info')"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3

  api:
    image: ${WOS_REGISTRY:-ghcr.io/batazor/autopilot}/bot:${WOS_IMAGE_TAG:-latest}
    container_name: autopilot-api
    command: ["api"]
    network_mode: host
    depends_on:
      redis:
        condition: service_healthy
    environment:
      WOS_REDIS_URL: unix:///var/run/redis/redis.sock?db=0
      WOS_API_HOST: 127.0.0.1
      WOS_API_PORT: "8765"
      ADB_SERVER_SOCKET: tcp:127.0.0.1:5037
      # Fish-detect debug page runs inference inside the API process; reach the
      # optional sidecar over the shared host loopback.
      WOS_INFERENCE_URL: http://127.0.0.1:9001
      ROBOFLOW_API_KEY: ${ROBOFLOW_API_KEY:-}
      # Same license-file path as ``bot``. ``WOS_LICENSE`` is still honored as
      # an env override. ``WOS_ADMIN_TOKEN`` is only set in the maintainer's
      # environment — without it, the issuer endpoint 403s.
      WOS_LICENSE: ${WOS_LICENSE:-}
      WOS_ADMIN_TOKEN: ${WOS_ADMIN_TOKEN:-}
    volumes:
      - wos_state:/app/db/state
      - wos_license:/app/license-data
      - wos_temporal:/app/temporal
      - redis_socket:/var/run/redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8765/health"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  web:
    image: ${WOS_REGISTRY:-ghcr.io/batazor/autopilot}/web:${WOS_IMAGE_TAG:-latest}
    container_name: autopilot-web
    network_mode: host
    depends_on:
      api:
        condition: service_healthy
    environment:
      # Next bakes the /api proxy target into the image at build time
      # (Dockerfile.web ARG WOS_API_URL → 127.0.0.1:8765 for host networking);
      # the runtime env is never re-read, so there's no WOS_API_URL here.
      HOSTNAME: 127.0.0.1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/overview').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 45s
      retries: 3

volumes:
  redis_data:
  redis_socket:
  wos_state:
  wos_license:
  wos_temporal:
  inference_cache:
